name: pnpm-assets-cache

on:
  workflow_call:

env:
  GITHUB_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
  PLAYBRO_REGISTRY: ${{ secrets.PLAYBRO_REGISTRY }}

jobs:
  assets-cache-update:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: playbro-tech/ci-cd/.github/actions/pnpm-install@v1

      - uses: playbro-tech/ci-cd/.github/actions/pnpm-assets@v1

      - name: Convert files
        run: pnpm meta-plugin:convert
